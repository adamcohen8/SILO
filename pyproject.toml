[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-appliance"
version = "0.1.0"
description = "SILO local document assistant with explicit folder capabilities"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["PySide6-Essentials==6.10.2", "shiboken6==6.10.2"]
agent = ["langgraph==1.2.13", "langsmith==0.14.4"]
documents = ["pypdf==6.19.0", "defusedxml==0.7.1"]

[project.scripts]
local-ai-workspace = "local_ai_appliance.desktop:main"
local-ai-agent = "local_ai_appliance.cli:main"
local-ai-bundle-check = "local_ai_appliance.bundle:main"

[tool.setuptools.packages.find]
where = ["src"]
